name: PR Build Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"

env:
  GO_VERSION: "1.22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...
