name: PR Coverage Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"

env:
  GO_VERSION: "1.22"
  MIN_COVERAGE: 70

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get changed Go files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.go
          files_ignore: |
            **/*_test.go
            **/mock_*.go
            **/mocks/**

      - name: Run tests with coverage
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          go test ./... \
            -coverpkg=./internal/core/...,./internal/adapters/primary/... \
            -coverprofile=coverage.out

      - name: Check coverage for modified files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          FAILED=0
          TOTAL_COVERAGE=0
          FILE_COUNT=0
          MIN=${{ env.MIN_COVERAGE }}

          COVER_OUTPUT=$(go tool cover -func=coverage.out)

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ ! -f "$file" ]]; then
              continue
            fi

            FILENAME=$(basename "$file")

            FILE_LINES=$(echo "$COVER_OUTPUT" | grep "/${FILENAME}:" || true)

            if [[ -z "$FILE_LINES" ]]; then
              echo "SKIP $file: not in coverage report"
              continue
            fi

            COVERAGE=$(echo "$FILE_LINES" | awk '{gsub(/%/,"",$NF); sum+=$NF; count++} END {if(count>0) printf "%.2f", sum/count; else print "0"}')

            if [[ -z "$COVERAGE" || "$COVERAGE" == "0" || "$COVERAGE" == "0.00" ]]; then
              echo "SKIP $file: no coverage data"
              continue
            fi

            TOTAL_COVERAGE=$(echo "$TOTAL_COVERAGE + $COVERAGE" | bc)
            FILE_COUNT=$((FILE_COUNT + 1))

            RESULT=$(echo "$COVERAGE < $MIN" | bc -l)
            if [[ "$RESULT" -eq 1 ]]; then
              echo "FAIL $file: ${COVERAGE}% (min: ${MIN}%)"
              FAILED=1
            else
              echo "PASS $file: ${COVERAGE}%"
            fi
          done

          if [[ $FILE_COUNT -gt 0 ]]; then
            AVG_COVERAGE=$(echo "scale=2; $TOTAL_COVERAGE / $FILE_COUNT" | bc)
            echo ""
            echo "Average coverage for modified files: ${AVG_COVERAGE}%"

            RESULT=$(echo "$AVG_COVERAGE < $MIN" | bc -l)
            if [[ "$RESULT" -eq 1 ]]; then
              echo "Average coverage is below ${MIN}%"
              FAILED=1
            fi
          fi

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

      - name: Upload coverage report
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Post coverage comment on PR
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            let coverageOutput = '';
            try {
              coverageOutput = execSync('go tool cover -func=coverage.out | tail -1').toString();
            } catch (e) {
              coverageOutput = 'Could not get coverage summary';
            }

            const totalMatch = coverageOutput.match(/(\d+\.?\d*)%/);
            const totalCoverage = totalMatch ? totalMatch[1] : 'N/A';

            const body = `## Coverage Report

            | Metric | Value |
            |--------|-------|
            | Total Coverage | ${totalCoverage}% |
            | Minimum Required | ${{ env.MIN_COVERAGE }}% |

            <details>
            <summary>Modified files in this PR</summary>

            \`\`\`
            ${{ steps.changed-files.outputs.all_changed_files }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
