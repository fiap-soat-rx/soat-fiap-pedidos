name: PR Coverage Check

on:
  pull_request:
    paths:
      - '**/*.go'

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run tests with coverage
        run: |
          go test ./internal/core/... ./internal/adapters/primary/... \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Get changed Go files
        id: changed_files
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep '\.go$' || true)
          echo "Changed files: $FILES"
          delimiter="$(openssl rand -hex 8)"
          echo "changed_files<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "$FILES" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

      - name: Calculate PR coverage
        id: pr_coverage
        run: |
          TOTAL=0
          COVERED=0
          FILES="${{ steps.changed_files.outputs.changed_files }}"

          if [ -z "$FILES" ]; then
            echo "No Go files changed in PR."
            echo "pr_coverage=100" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Processa coverage.out
          while read -r line; do
            if [[ "$line" == mode:* ]]; then
              continue
            fi

            FILE=$(echo "$line" | cut -d: -f1)
            STATEMENTS=$(echo "$line" | awk '{print $2}')
            COUNT=$(echo "$line" | awk '{print $3}')

            for f in $(echo "$FILES" | tr ',' ' '); do
              if [[ "$FILE" == *"$f" ]]; then
                TOTAL=$((TOTAL + STATEMENTS))
                COVERED=$((COVERED + COUNT))
              fi
            done
          done < coverage.out

          if [ "$TOTAL" -eq 0 ]; then
            echo "No coverage info for changed files."
            echo "pr_coverage=0" >> $GITHUB_OUTPUT
          else
            PR_COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($COVERED/$TOTAL)*100}")
            echo "PR coverage: $PR_COVERAGE%"
            echo "pr_coverage=$PR_COVERAGE" >> $GITHUB_OUTPUT

      - name: Fail if PR coverage < 80%
        if: ${{ steps.pr_coverage.outputs.pr_coverage != '' && steps.pr_coverage.outputs.pr_coverage < 80 }}
        run: |
          echo "PR coverage is below 80%! Failing check."
          exit 1
